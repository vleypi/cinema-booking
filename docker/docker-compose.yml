name: cinema-booking

x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cinema}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      <<: *app-build
      target: backend
      args:
        APP: backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cinema}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  cinema:
    build:
      <<: *app-build
      target: next
      args:
        APP: cinema
    restart: unless-stopped
    ports:
      - "${CINEMA_PORT:-3001}:3000"
    depends_on:
      - backend

  crm:
    build:
      <<: *app-build
      target: next
      args:
        APP: crm
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-3002}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
