name: cinema-booking

x-app-build: &app-build
  context: ..
  dockerfile: docker/Dockerfile

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 5s
    timeout: 5s
    retries: 10

x-redis: &redis
  image: redis:8-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 5s
    retries: 10

x-depends-on-backend: &depends-on-backend
  backend:
    condition: service_healthy

services:
  postgres:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cinema}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    <<: *postgres
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinema_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    <<: *redis

  redis-test:
    <<: *redis
    profiles: [test]
    ports:
      - "6380:6379"

  backend:
    build:
      <<: *app-build
      target: backend
      args:
        APP: backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cinema}
      REDIS_URL: redis://redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_SUPER_ADMIN_PASSWORD: ${SEED_SUPER_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  cinema:
    build:
      <<: *app-build
      target: next
      args:
        APP: cinema
    restart: unless-stopped
    ports:
      - "${CINEMA_PORT:-3001}:3000"
    depends_on: *depends-on-backend

  crm:
    build:
      <<: *app-build
      target: next
      args:
        APP: crm
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-3002}:3000"
    depends_on: *depends-on-backend

volumes:
  postgres-data:
